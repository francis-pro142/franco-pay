<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FRANCO PAY — Admin Audit Logs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h1>Admin — Audit Logs</h1>
      <div class="top-actions">
        <input id="auditSearch" placeholder="Search action, user, entity or metadata" />
        <select id="auditPageSize">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
        </select>
        <select id="auditSortBy">
          <option value="created_at">Date</option>
          <option value="user_id">User</option>
          <option value="action">Action</option>
          <option value="entity_type">Entity</option>
        </select>
        <select id="auditSortOrder">
          <option value="DESC">Desc</option>
          <option value="ASC">Asc</option>
        </select>
        <button id="exportCsv">Export CSV</button>
        <button id="refreshAudit">Refresh</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Recent audit events</h2>
        <div id="auditContainer" class="audit-list">
          <div class="empty-state">Loading audit logs…</div>
        </div>

        <div class="pagination-controls">
          <button id="prevPage">Prev</button>
          <span id="currentPage">1</span>
          <button id="nextPage">Next</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
