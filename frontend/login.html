<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FRANCO PAY — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <h1>FRANCO PAY</h1>
      <h2>Secure Login</h2>
      <form id="loginForm">
        <label>Email or phone<input name="email" placeholder="name@example.com or +233..." required></label>
        <label>Password<input type="password" name="password" placeholder="Enter password" required></label>
        <button type="submit">LOGIN</button>
      </form>
      <p class="alt-link">Need an account? <a href="register.html">Create account</a></p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
