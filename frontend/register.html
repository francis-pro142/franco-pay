<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FRANCO PAY — Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <h1>FRANCO PAY</h1>
      <h2>Create Account</h2>
      <form id="registerForm">
        <label>Full name<input name="full_name" placeholder="Francis Quayson" required></label>
        <label>Email<input type="email" name="email" placeholder="name@example.com"></label>
        <label>Phone number<input name="phone" placeholder="+233 20 000 0000"></label>
        <label>Password<input type="password" name="password" placeholder="Create a strong password" required></label>
        <button type="submit">REGISTER</button>
      </form>
      <p class="alt-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
