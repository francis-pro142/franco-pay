<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FRANCO PAY — Send Money</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="transfer-body">
  <div id="recipientModal" class="recipient-modal hidden" aria-hidden="true">
    <div class="recipient-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalRecipientTitle">
      <div class="modal-header">
        <span class="eyebrow">Confirmation</span>
        <h3 id="modalRecipientTitle">Confirm recipient</h3>
      </div>

      <div class="recipient-modal-body">
        <div class="recipient-pill">Recipient</div>
        <h4 id="reviewName">--</h4>
        <p id="reviewWallet">--</p>
      </div>

      <div class="review-actions">
        <button type="button" id="confirmTransferBtn" class="confirm-btn">Confirm & send</button>
        <button type="button" id="cancelReviewBtn" class="secondary-btn">Cancel</button>
      </div>
    </div>
  </div>

  <main class="transfer-shell">
    <section class="transfer-panel transfer-summary">
      <div class="transfer-header">
        <span class="eyebrow">Transfer</span>
        <h1>Send money</h1>
      </div>

      <div class="security-badge">
        <span class="security-dot"></span>
        Secure transfer verified
      </div>

      <div class="summary-box">
        <span>Available balance</span>
        <strong id="availableBalance">GHC 0.00</strong>
      </div>

      <ul class="transfer-checks">
        <li>Recipient wallet must be valid</li>
        <li>Funds must be sufficient</li>
        <li>Self-transfer is blocked</li>
      </ul>

      <a href="dashboard.html" class="back-link">← Back to dashboard</a>
    </section>

    <section class="transfer-panel transfer-form-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Payment</p>
          <h2>New transfer</h2>
        </div>
      </div>

      <form id="sendForm" class="transfer-form">
        <label>
          Recipient wallet number
          <input name="recipient" required placeholder="FP02376419" autocomplete="off">
        </label>

        <label>
          Amount
          <input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00">
        </label>

        <label>
          Description
          <input name="description" placeholder="Payment for invoice / services">
        </label>

        <button type="submit" id="reviewTransferBtn">Review transfer</button>
      </form>

      <div id="result" class="result-box" aria-live="polite">Ready to send.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
